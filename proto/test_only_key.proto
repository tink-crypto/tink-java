// Protos of test-only key types. These keys provide no security at all and
// must only be used in tests of Tink features that do not depend on a specific
// algorithm (keyset handles, configurations, registries...).
syntax = "proto3";

package google.crypto.tink;

option java_package = "com.google.crypto.tink.proto";
option java_multiple_files = true;
option go_package = "github.com/tink-crypto/tink-go/v2/proto/test_only_key_go_proto";

message TestOnlyKeyFormat {
  // Size of the key material in bytes.
  uint32 key_size = 1;
}

// key_type: type.googleapis.com/google.crypto.tink.TestOnlyKey
message TestOnlyKey {
  uint32 version = 1;
  bytes key_value = 2;
}

// key_type: type.googleapis.com/google.crypto.tink.TestOnlyPublicKey
message TestOnlyPublicKey {
  uint32 version = 1;
  bytes key_value = 2;
}

// key_type: type.googleapis.com/google.crypto.tink.TestOnlyPrivateKey
message TestOnlyPrivateKey {
  uint32 version = 1;
  TestOnlyPublicKey public_key = 2;
  bytes key_value = 3;
}
